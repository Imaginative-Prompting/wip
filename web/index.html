<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090909" />
    <title>WIP</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="markup.css" />
  </head>
  <body>
    <header class="topbar">
      <a id="home-link" class="brand" href="/" aria-label="WIP home">wip</a>
      <div class="connection">
        <span id="live-dot"></span><span id="connection">Live workspace</span>
      </div>
    </header>
    <main>
      <div class="heading">
        <div>
          <h1 id="project-title">Work in progress.</h1>
          <p id="project-description" class="description"></p>
        </div>
        <div class="project-select">
          <label for="projects">Workspace</label
          ><select id="projects" aria-label="Project"></select>
        </div>
      </div>
      <section id="current" class="current" aria-label="Current cut"></section>
      <section class="library" aria-label="Work in progress entries">
        <div class="search-row">
          <div class="search-wrap">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></span
            ><input
              id="search"
              type="search"
              placeholder="Search"
              aria-label="Search work"
            /><kbd>/</kbd>
          </div>
          <button id="collapse" class="subtle">Collapse all</button>
        </div>
        <div class="filter-row">
          <div id="tags" class="tags" aria-label="Filter by tag"></div>
          <span
            id="result-count"
            class="result-count"
            aria-live="polite"
          ></span>
        </div>
        <div id="notice" role="status" hidden></div>
        <div id="list"></div>
        <div id="empty" class="empty" hidden>
          <span>Nothing here yet.</span>
          <p>Try another search or clear the selected tags.</p>
          <button id="clear" class="subtle">Clear filters</button>
        </div>
      </section>

    </main>
    <section id="preview" aria-label="Video preview" hidden>
      <video id="video" playsinline preload="metadata"></video>
      <div id="preview-message" role="status"></div>
      <div class="preview-label">
        <button id="move-preview" class="preview-move" aria-label="Move video preview"><span aria-hidden="true">⠿</span> <span id="preview-title"></span></button
        ><button id="hide-preview" class="icon" aria-label="Hide video preview">
          ×
        </button>
      </div>
      <button id="video-fullscreen" class="icon video-fullscreen" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      <button id="resize-preview" class="preview-resize" aria-label="Resize video preview"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m5 17 12-12m-6 12 6-6"/></svg></button>
    </section>
    <footer id="dock" class="dock" aria-label="Player">
      <div class="now">
        <div id="now-art" class="now-art" aria-hidden="true">♪</div>
        <div>
          <select id="dock-projects" aria-label="Switch WIP"></select>
          <div id="now-title">Nothing playing</div>
          <div id="now-subtitle">Choose something to play</div>
          <div class="track-switch"><button id="current-track" aria-pressed="false" disabled>Current cut</button><button id="return-clip" aria-pressed="false" hidden>Back to clip</button><button id="browse-clips" class="browse-clips" aria-label="Browse clips" aria-expanded="false" aria-controls="clip-picker" title="Browse all clips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m5 15 7-7 7 7"/></svg></button></div>
        </div>
      </div>
      <section id="clip-picker" class="clip-picker" aria-label="Clip picker" hidden>
        <div class="clip-heading"><span id="clip-heading">Clips</span><span>Newest first</span><button id="close-clips" class="icon" aria-label="Close clip picker">×</button></div>
        <input id="clip-search" type="search" placeholder="Find a clip" aria-label="Search clips" />
        <div id="clip-list" class="clip-list"></div>
      </section>
      <div class="transport">
        <div class="buttons">
          <button id="frame-back" class="icon frame-step" aria-label="Previous frame" title="Previous frame (,)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 5v14M19 5l-9 7 9 7Z"/></svg></button>
          <button
            id="back"
            class="icon"
            aria-label="Back 1 second"
            title="Back 1 second"
          >
            −1</button
          ><button id="play" class="play" aria-label="Play" disabled>▶</button
          ><button
            id="forward"
            class="icon"
            aria-label="Forward 1 second"
            title="Forward 1 second"
          >
            +1</button>
          <button id="frame-forward" class="icon frame-step" aria-label="Next frame" title="Next frame (.)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M19 5v14M5 5l9 7-9 7Z"/></svg></button><button
            id="repeat"
            class="icon"
            aria-label="Repeat"
            aria-pressed="true"
            aria-describedby="repeat-tip"
          >
            <svg class="repeat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="m17 3 4 4-4 4M3 11V10a3 3 0 0 1 3-3h15M7 21l-4-4 4-4m14 0v1a3 3 0 0 1-3 3H3" />
            </svg>
            <span id="repeat-tip" class="control-tip" role="tooltip">Repeating · turn off</span>
          </button>
        </div>
        <div class="scrubber">
          <span id="elapsed">0:00</span>
          <div class="seek-wrap">
            <input
              id="seek"
              type="range"
              min="0"
              max="100"
              step="0.01"
              value="0"
              aria-label="Playback position"
              disabled
            />
            <div id="chapters"></div>
            <div id="seek-tip" hidden></div>
          </div>
          <span id="duration">0:00</span>
        </div>
        <div class="lyric">
          <span id="lyric"></span>
          <button id="copy-frame" type="button" aria-describedby="frame-copy-tip" hidden>
            <span>Frame</span><span id="frame-number"></span><span id="frame-rate"></span>
            <span id="frame-copy-status" role="status"></span>
            <span id="frame-copy-tip" class="control-tip" role="tooltip">Click to copy clip and frame</span>
          </button>
        </div>
      </div>
      <div class="options">
        <button id="mute" class="icon" aria-label="Mute" title="Mute">♪</button
        ><input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          aria-label="Volume"
        /><button id="quality" class="text-button" hidden>720p</button
        ><button
          id="show-preview"
          class="icon"
          aria-label="Show video preview"
          aria-pressed="false"
          disabled
          title="Video preview"
        >
          ▣</button
        ><button
          id="theatre"
          class="icon"
          aria-label="Enter theatre mode"
          aria-pressed="false"
          disabled
          title="Theatre mode"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="1"/><path d="M2 16h20"/></svg>
        </button>
      </div>
    </footer>
    <audio id="audio" preload="metadata"></audio>
    <dialog id="lightbox">
      <button id="close-lightbox" class="icon" aria-label="Close image">
        ×</button
      ><img alt="" />
      <p></p>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
